# =============================================================================
# PostgreSQL 17 학습용 설정 파일
# 각 파라미터의 의미는 notes/14-monitoring-and-tuning.md 에서 상세 설명
# =============================================================================

# -----------------------------------------------------------------------------
# 접속 설정
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# -----------------------------------------------------------------------------
# 메모리 (OS 공유 메모리 위에 할당)
# -----------------------------------------------------------------------------
shared_buffers = 128MB          # 전체 RAM의 25% 권장 (Docker 환경이므로 축소)
work_mem = 4MB                  # 정렬/해시 연산에 프로세스당 할당
maintenance_work_mem = 64MB     # VACUUM, CREATE INDEX 등에 사용
effective_cache_size = 512MB    # OS page cache 포함 추정치 (플래너 힌트)

# huge_pages = try                # 리눅스 Huge Pages 사용 시도 (Docker에서는 off 권장)

# -----------------------------------------------------------------------------
# WAL 설정 (notes/03-wal-and-reliability.md 참조)
# -----------------------------------------------------------------------------
wal_level = replica             # 복제 가능 레벨 (logical로 변경 가능)
wal_buffers = 4MB
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9

# WAL 아카이빙 (PITR 실습용)
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal-archive/%f'

# -----------------------------------------------------------------------------
# 복제 설정
# -----------------------------------------------------------------------------
max_wal_senders = 3
wal_keep_size = 256MB
hot_standby = on

# -----------------------------------------------------------------------------
# 쿼리 플래너 (notes/07-query-optimization.md 참조)
# -----------------------------------------------------------------------------
random_page_cost = 1.1          # SSD 환경 (HDD는 4.0)
effective_io_concurrency = 200  # SSD 병렬 I/O
default_statistics_target = 100

# 병렬 쿼리
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# JIT 컴파일
jit = on

# -----------------------------------------------------------------------------
# VACUUM / Autovacuum (notes/05-vacuum-and-maintenance.md 참조)
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1

# -----------------------------------------------------------------------------
# 로깅
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'all'           # 학습용: 모든 SQL 로깅 (운영에서는 none 또는 ddl)
log_duration = on
log_min_duration_statement = 100  # 100ms 이상 느린 쿼리 기록
log_lock_waits = on
log_temp_files = 0

# -----------------------------------------------------------------------------
# 통계 수집
# -----------------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on            # I/O 시간 측정 (EXPLAIN BUFFERS에 필요)
track_wal_io_timing = on        # v17: WAL I/O 시간 측정

# pg_stat_statements (확장 모듈)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all

# -----------------------------------------------------------------------------
# v17 신규 설정
# -----------------------------------------------------------------------------
# io_combine_limit = 128kB      # 결합 I/O 요청 크기 제어
# transaction_timeout = 0        # 트랜잭션 최대 시간 (0 = 무제한)
