# =============================================================================
# PostgreSQL 17 학습용 설정 파일
# 각 파라미터의 의미는 notes/14-monitoring-and-tuning.md 에서 상세 설명
# =============================================================================
#
# ─── 이 파일의 역할 ───────────────────────────────────────────────────────────
#
# PostgreSQL 17에는 약 350개 이상의 설정 파라미터가 존재한다.
# 이 파일에는 그 중 ~30개만 명시적으로 설정하고 있다.
# 나머지는 PostgreSQL 소스코드에 하드코딩된 기본값(default)으로 동작한다.
#
# 기본값이 대부분의 상황에서 합리적이므로,
# 문제가 생기거나 특정 워크로드에 맞출 때만 필요한 항목을 건드리는 것이 정석.
#
# ─── 설정값 우선순위 (아래로 갈수록 높음) ─────────────────────────────────────
#
# 1. 소스코드 기본값      : 빌드 시 결정. 대부분의 파라미터 출발점
# 2. postgresql.conf      : 이 파일. 서버 시작 시 읽음
# 3. postgresql.auto.conf : ALTER SYSTEM 명령 시 자동 기록 (이 파일보다 우선!)
# 4. 커맨드라인 플래그     : postgres -c work_mem=8MB
# 5. 데이터베이스별        : ALTER DATABASE ecommerce SET work_mem = '16MB';
# 6. 유저별               : ALTER ROLE labuser SET work_mem = '16MB';
# 7. 세션별               : SET work_mem = '64MB';
# 8. 트랜잭션별           : SET LOCAL work_mem = '128MB';
#
# ─── 유용한 조회 쿼리 ────────────────────────────────────────────────────────
#
# -- 전체 파라미터 수
# SELECT COUNT(*) FROM pg_settings;
#
# -- 기본값에서 변경된 항목만 보기
# SELECT name, setting, boot_val, source
# FROM pg_settings WHERE source != 'default' ORDER BY source, name;
#
# -- 출처별 개수 (몇 개를 직접 설정했는지)
# SELECT source, COUNT(*) FROM pg_settings GROUP BY source ORDER BY COUNT(*) DESC;
#
# -- 특정 파라미터의 출처 확인
# SELECT name, setting, source, sourcefile, sourceline FROM pg_settings WHERE name = 'work_mem';
#
# -- 특정 키워드로 파라미터 검색
# SELECT name, setting, unit, short_desc FROM pg_settings WHERE name LIKE '%timeout%';
#
# ─── 전체 파라미터 레퍼런스 ───────────────────────────────────────────────────
#
# 공식 문서: https://www.postgresql.org/docs/17/runtime-config.html
# 컨테이너에서 전체 목록 출력: docker exec pg17-lab postgres --describe-config
#
# =============================================================================

# =============================================================================
# 접속 설정
# =============================================================================

# listen_addresses (string)
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL이 클라이언트 연결을 수신할 네트워크 인터페이스(IP)를 지정한다.
#
# - '*'       : 모든 네트워크 인터페이스에서 수신 (외부 접속 허용)
# - 'localhost': 로컬 접속만 허용
# - '0.0.0.0'  : 모든 IPv4 인터페이스
#
# 왜 필요한가:
#   Docker 컨테이너 내부에서 실행되므로 호스트에서 접속하려면 '*'이어야 한다.
#   프로덕션에서는 특정 IP만 지정하거나 방화벽/pg_hba.conf로 접근을 제한한다.
#
# 변경 시 재시작 필요 (reload로는 불가)
listen_addresses = '*'

# port (integer)
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL이 연결을 대기하는 TCP 포트 번호.
# 기본값 5432. 한 서버에 여러 인스턴스를 띄울 때 각각 다른 포트를 쓴다.
#
# 변경 시 재시작 필요
port = 5432

# max_connections (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 동시에 연결 가능한 최대 클라이언트 수.
#
# 왜 중요한가:
#   PostgreSQL은 연결 1개 = 프로세스 1개(fork)다.
#   100이면 최대 100개의 백엔드 프로세스가 생길 수 있다는 뜻이다.
#   각 프로세스는 work_mem, temp_buffers 등 로컬 메모리를 사용하므로
#   max_connections × work_mem 만큼의 메모리가 필요할 수 있다.
#
# 실전 가이드:
#   - 직접 연결: 100~200이면 대부분 충분
#   - 동시 접속이 수천 이상 필요하면 PgBouncer 같은 connection pooler를 앞에 둔다
#   - 늘릴수록 lock contention, 컨텍스트 스위칭 비용이 증가한다
#
# 대략적인 메모리 계산:
#   max_connections(100) × work_mem(4MB) = 최대 400MB (정렬/해시 시)
#   + shared_buffers(128MB) + OS 등 → 총 ~700MB~1GB
#
# 변경 시 재시작 필요
max_connections = 100

# =============================================================================
# 메모리 (OS 공유 메모리 위에 할당)
# =============================================================================

# shared_buffers (integer)
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL이 데이터 페이지를 캐시하는 공유 메모리 버퍼 풀의 크기.
#
# 이것이 하는 일:
#   테이블/인덱스의 8KB 페이지를 메모리에 올려두어 디스크 I/O를 줄인다.
#   모든 백엔드 프로세스가 이 메모리를 공유한다.
#
# 왜 중요한가:
#   - 너무 작으면: 디스크 I/O가 많아져 쿼리가 느려진다
#   - 너무 크면: OS page cache에 쓸 메모리가 줄어 오히려 성능 저하
#   - PostgreSQL은 OS page cache도 활용하므로, 전부 shared_buffers에 할당하면 안 됨
#
# 권장값:
#   전체 RAM의 25%. 단, 매우 큰 서버(256GB+)에서도 8~16GB 이상은 효과가 줄어든다.
#   현재 Docker 메모리 제한이 1GB이므로 128MB (약 12.5%)로 설정.
#
# 모니터링:
#   SELECT * FROM pg_buffercache;  -- 버퍼 안의 페이지 목록
#   pg_statio_user_tables의 heap_blks_hit / (hit + read) → 히트율 99%+ 목표
#
# 변경 시 재시작 필요
shared_buffers = 128MB

# work_mem (integer)
# ─────────────────────────────────────────────────────────────────────────────
# ORDER BY, DISTINCT, Hash Join, Hash Aggregate 등 정렬/해시 연산 시
# **각 연산 노드마다** 할당되는 메모리 크기.
#
# 핵심 주의점:
#   "프로세스당"이 아니라 "연산 노드당"이다!
#   하나의 쿼리 안에 정렬 2개 + 해시 조인 1개가 있으면 4MB × 3 = 12MB를 쓸 수 있다.
#   100개 커넥션이 동시에 이런 쿼리를 돌리면 → 100 × 12MB = 1.2GB
#
# work_mem이 부족하면:
#   정렬 데이터가 메모리에 안 들어가서 디스크 임시파일(temp file)에 쓴다.
#   EXPLAIN ANALYZE에서 "Sort Method: external merge Disk" 가 보이면 work_mem 부족.
#
# work_mem이 충분하면:
#   "Sort Method: quicksort Memory: 1234kB" 처럼 메모리 내에서 처리.
#
# 실전:
#   - 기본값 4MB로 시작
#   - 슬로우 쿼리에서 디스크 정렬이 보이면 세션 단위로 올려서 테스트:
#     SET work_mem = '64MB';  -- 현재 세션에만 적용
#   - 전역으로 크게 올리면 OOM 위험
#
# reload로 변경 가능 (재시작 불필요)
work_mem = 4MB

# maintenance_work_mem (integer)
# ─────────────────────────────────────────────────────────────────────────────
# VACUUM, CREATE INDEX, ALTER TABLE ADD FOREIGN KEY 등
# 유지보수 작업에 할당되는 메모리.
#
# work_mem과의 차이:
#   - work_mem: 일반 쿼리의 정렬/해시 (동시에 수백 개 가능)
#   - maintenance_work_mem: 유지보수 작업 (동시에 autovacuum_max_workers 수만큼)
#
# 크게 잡으면 좋은 점:
#   - VACUUM이 더 빠르게 dead tuple 목록을 처리
#   - CREATE INDEX가 더 빠름 (특히 대용량 테이블)
#
# 권장값:
#   RAM 1GB당 50~100MB. 최대 1~2GB면 충분.
#   현재 Docker 1GB 제한이므로 64MB.
#
# reload로 변경 가능
maintenance_work_mem = 64MB

# effective_cache_size (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 실제 메모리를 할당하는 설정이 아니다! 플래너에게 주는 "힌트"일 뿐이다.
#
# "OS page cache + shared_buffers를 합쳐서 대략 이 정도의 캐시가 있을 것이다"
# 라고 플래너에게 알려주는 값.
#
# 플래너에 미치는 영향:
#   - 이 값이 크면: 플래너가 "디스크 I/O가 적을 것"이라 예상
#     → Index Scan을 더 선호 (random read가 캐시에서 처리될 거라 기대)
#   - 이 값이 작으면: 플래너가 "디스크를 많이 읽어야 할 것"이라 예상
#     → Sequential Scan을 더 선호 (순차 읽기가 효율적이라 판단)
#
# 권장값:
#   전체 RAM의 50~75%.
#   현재 Docker 1GB 제한 → 512MB.
#
# reload로 변경 가능
effective_cache_size = 512MB

# huge_pages (enum: try | on | off)
# ─────────────────────────────────────────────────────────────────────────────
# Linux Huge Pages(2MB 단위 메모리 페이지)를 사용할지 여부.
#
# 일반 페이지(4KB) vs Huge Pages(2MB):
#   shared_buffers가 8GB이면 → 4KB 페이지: 2,097,152개의 페이지 테이블 엔트리(PTE)
#                              2MB 페이지: 4,096개의 PTE
#   PTE가 적으면 TLB(Translation Lookaside Buffer) 미스가 줄어 성능이 향상된다.
#
# 효과가 큰 경우:
#   shared_buffers가 수 GB 이상일 때 (8GB+). 1~5% 성능 향상 가능.
#   shared_buffers가 128MB인 현재 환경에서는 효과 미미.
#
# Docker에서는 호스트 커널의 huge pages 설정에 의존하므로 off 권장.
# huge_pages = try

# =============================================================================
# WAL 설정 (Write-Ahead Logging)
# =============================================================================

# wal_level (enum: minimal | replica | logical)
# ─────────────────────────────────────────────────────────────────────────────
# WAL에 기록하는 정보의 상세 수준.
#
# 각 레벨이 필요한 상황:
#   - minimal  : WAL 최소 기록. 복제/PITR 불가. 성능 최대. (단독 서버, 백업 불필요 시)
#   - replica   : 물리 복제(streaming replication) + PITR 가능. 대부분의 프로덕션 기본값.
#   - logical   : 논리 복제(logical replication) 가능. 테이블 단위 선택적 복제 시 필요.
#
# 높은 레벨일수록 WAL 기록량이 증가하여 디스크 I/O가 늘어난다.
# replica → logical로 올리면 WAL 크기가 약간(~10%) 증가.
#
# 변경 시 재시작 필요
wal_level = replica

# wal_buffers (integer)
# ─────────────────────────────────────────────────────────────────────────────
# WAL 데이터를 디스크에 쓰기 전에 잠시 보관하는 메모리 버퍼.
#
# 트랜잭션이 커밋될 때 WAL 레코드가 이 버퍼에 먼저 쓰이고,
# walwriter 프로세스가 주기적으로 또는 커밋 시점에 디스크로 flush한다.
#
# 기본값 -1은 shared_buffers의 1/32 (자동 계산).
# shared_buffers=128MB → 자동값 = 4MB. 여기서는 명시적으로 4MB 설정.
#
# 대부분 기본값으로 충분하다. 매우 높은 TPS(수만 이상)에서만 늘릴 필요.
#
# 변경 시 재시작 필요
wal_buffers = 4MB

# max_wal_size (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 체크포인트 사이에 WAL이 누적될 수 있는 최대 크기.
#
# 이 크기를 초과하면 PostgreSQL이 자동으로 체크포인트를 트리거한다.
#
# 왜 중요한가:
#   - 너무 작으면: 체크포인트가 너무 자주 발생 → I/O 스파이크, 성능 저하
#   - 너무 크면: 크래시 복구 시 replay할 WAL이 많아 복구 시간이 길어짐
#
# 실전:
#   - 일반: 1~4GB
#   - 대량 쓰기 워크로드: 8~16GB
#   - pg_stat_checkpointer에서 num_requested가 num_timed보다 많으면
#     → WAL이 빨리 차서 강제 체크포인트가 발생하는 것 → max_wal_size를 늘려야 함
#
# reload로 변경 가능
max_wal_size = 1GB

# min_wal_size (integer)
# ─────────────────────────────────────────────────────────────────────────────
# WAL 파일이 재활용되어 유지되는 최소 크기.
# 이 값 이하로는 WAL 파일이 삭제되지 않고 재사용된다.
#
# WAL 파일 삭제→재생성의 오버헤드를 줄이기 위한 설정.
# 대부분 기본값(80MB)으로 충분.
#
# reload로 변경 가능
min_wal_size = 80MB

# checkpoint_timeout (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 자동 체크포인트 간 최대 시간 간격.
#
# 체크포인트란:
#   shared_buffers의 더티 페이지(수정됐지만 아직 디스크에 안 쓴 페이지)를
#   모두 디스크에 기록하는 작업. 이후 해당 WAL은 더 이상 복구에 불필요.
#
# 5min이면: 최소 5분마다 체크포인트 발생 (max_wal_size에 먼저 도달하면 더 일찍).
#
# 실전:
#   - 기본 5min은 소규모 환경에 적합
#   - 대규모 프로덕션에서는 15~30min으로 늘려 I/O 부담 분산
#   - 늘리면 크래시 복구 시간도 늘어나므로 트레이드오프
#
# reload로 변경 가능
checkpoint_timeout = 5min

# checkpoint_completion_target (float: 0.0 ~ 1.0)
# ─────────────────────────────────────────────────────────────────────────────
# 체크포인트의 더티 페이지 쓰기를 다음 체크포인트까지의 시간 중
# 몇 퍼센트에 걸쳐 분산할지 결정.
#
# 0.9 = checkpoint_timeout(5min)의 90% = 4.5분에 걸쳐 천천히 쓴다.
# 0.1 = 빠르게 몰아서 쓴다 → 디스크 I/O 스파이크 발생.
#
# 왜 0.9인가:
#   체크포인트가 한꺼번에 대량 I/O를 하면 그 동안 일반 쿼리 성능이 떨어진다.
#   0.9로 분산하면 I/O가 고르게 퍼져 사용자 체감 성능이 안정적.
#
# reload로 변경 가능
checkpoint_completion_target = 0.9

# archive_mode (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# WAL 파일 아카이빙 활성화 여부.
#
# on으로 설정하면 WAL 세그먼트(기본 16MB)가 완성될 때마다
# archive_command를 실행하여 별도 위치에 복사한다.
#
# 왜 필요한가:
#   - PITR(Point-In-Time Recovery): 특정 시점으로 데이터베이스 복원
#   - 연속 백업: pg_basebackup + 아카이브된 WAL로 완전한 백업 체인 구성
#
# archive_mode만 on이고 archive_command가 빈 문자열이면
# WAL 파일이 삭제되지 않고 계속 쌓여 디스크가 꽉 찬다 — 주의!
#
# 변경 시 재시작 필요
archive_mode = on

# archive_command (string)
# ─────────────────────────────────────────────────────────────────────────────
# WAL 세그먼트를 아카이브할 때 실행되는 셸 명령어.
#
# %p = WAL 파일의 전체 경로 (예: pg_wal/000000010000000000000001)
# %f = WAL 파일명만 (예: 000000010000000000000001)
#
# 현재 설정:
#   컨테이너 내부의 /var/lib/postgresql/wal-archive/ 디렉토리에 복사.
#   docker-compose.yml에서 wal-archive 볼륨으로 마운트되어 있음.
#
# 프로덕션에서는:
#   - NFS/S3 같은 별도 스토리지로 전송
#   - pgBackRest, barman 같은 전문 백업 도구 사용
#   - 예: archive_command = 'pgbackrest --stanza=main archive-push %p'
#
# 이 명령이 exit 0을 반환해야 아카이브 성공으로 간주.
# 실패하면 WAL 파일이 삭제되지 않고 pg_wal에 계속 쌓인다.
#
# reload로 변경 가능
archive_command = 'cp %p /var/lib/postgresql/wal-archive/%f'

# =============================================================================
# 복제 설정
# =============================================================================

# max_wal_senders (integer)
# ─────────────────────────────────────────────────────────────────────────────
# WAL을 스트리밍으로 받아가는 클라이언트(replica, pg_basebackup 등)의 최대 동시 수.
#
# 각 wal sender는 별도의 프로세스로 동작한다.
# max_connections와는 별도로 계산되지만, max_connections 안에 포함된다.
#
# 산정 기준:
#   replica 수 + pg_basebackup 동시 실행 수 + 여유분
#   replica 2대 + 백업 1 = 3이면 충분.
#
# 0으로 설정하면 복제가 완전히 비활성화된다.
#
# 변경 시 재시작 필요
max_wal_senders = 3

# wal_keep_size (integer)
# ─────────────────────────────────────────────────────────────────────────────
# replica가 WAL을 아직 가져가지 못했을 때를 대비해
# pg_wal 디렉토리에 보관할 WAL 파일의 최소 크기.
#
# 왜 필요한가:
#   replica가 네트워크 문제 등으로 잠시 끊겼다가 재연결할 때,
#   필요한 WAL이 이미 삭제되었으면 replica를 처음부터 다시 구축해야 한다.
#   wal_keep_size가 충분하면 끊겼다 돌아와도 이어서 복제 가능.
#
# 256MB = WAL 세그먼트(16MB) 약 16개 보관.
#
# 프로덕션에서는 replication slot을 쓰는 것이 더 안전하다.
# (slot은 replica가 받아갈 때까지 WAL을 절대 삭제하지 않음)
#
# reload로 변경 가능
wal_keep_size = 256MB

# hot_standby (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# replica 서버에서 읽기 쿼리(SELECT)를 허용할지 여부.
#
# on  : replica가 WAL을 적용하면서도 동시에 SELECT를 처리 (Hot Standby)
# off : replica는 WAL 적용만 하고 쿼리 불가 (Warm Standby)
#
# 이 설정은 replica에서 의미가 있다. primary에서는 무시된다.
# 하지만 primary의 postgresql.conf에도 미리 설정해두면
# 나중에 이 서버가 replica로 전환될 때 바로 적용된다.
#
# 변경 시 재시작 필요
hot_standby = on

# =============================================================================
# 쿼리 플래너
# =============================================================================

# random_page_cost (float)
# ─────────────────────────────────────────────────────────────────────────────
# 랜덤 디스크 I/O 1페이지를 읽는 비용 (플래너 추정용).
# seq_page_cost(기본 1.0) 대비 상대적인 값이다.
#
# 이 값이 플래너에 미치는 영향:
#   - 높으면 (4.0, HDD): "랜덤 읽기가 비싸다" → Sequential Scan 선호
#   - 낮으면 (1.1, SSD): "랜덤 읽기가 순차와 거의 비슷하다" → Index Scan 선호
#
# HDD에서 4.0인 이유:
#   HDD는 랜덤 읽기 시 디스크 헤드가 물리적으로 이동(seek)해야 해서
#   순차 읽기 대비 40~100배 느리다. 4.0은 상당히 보수적인 값.
#
# SSD에서 1.1인 이유:
#   SSD는 seek가 없으므로 랜덤과 순차의 차이가 거의 없다.
#   1.0(동일)까지 낮출 수 있지만, 약간의 오버헤드를 고려해 1.1.
#
# 잘못 설정하면:
#   SSD인데 4.0 → 인덱스가 있는데도 풀스캔하는 비효율적인 계획 생성
#   HDD인데 1.1 → 대용량 테이블에서 인덱스 스캔을 시도해 오히려 느려짐
#
# reload로 변경 가능
random_page_cost = 1.1

# effective_io_concurrency (integer)
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL이 동시에 실행할 수 있다고 가정하는 I/O 요청 수.
# Bitmap Heap Scan에서 prefetch할 페이지 수를 결정한다.
#
# SSD/NVMe: 200 (병렬 I/O 가능)
# HDD 단일 디스크: 2
# RAID 어레이: 디스크 수에 비례
#
# Bitmap Heap Scan이 뭔가:
#   Index Scan으로 먼저 필요한 페이지 목록을 수집한 뒤,
#   해당 페이지들을 순서대로 읽는 방식. prefetch로 I/O를 겹치게 요청하면 빨라진다.
#
# reload로 변경 가능
effective_io_concurrency = 200

# default_statistics_target (integer: 1 ~ 10000)
# ─────────────────────────────────────────────────────────────────────────────
# ANALYZE가 각 컬럼의 통계(히스토그램, MCV 등)를 수집할 때의 샘플 정밀도.
#
# 기본값 100 = 히스토그램 버킷 100개.
# 높이면 플래너가 데이터 분포를 더 정확히 파악 → 더 나은 실행 계획.
# 대신 ANALYZE가 느려지고 pg_statistic 테이블이 커진다.
#
# 실전:
#   - 대부분의 컬럼: 100이면 충분
#   - 분포가 매우 치우친(skewed) 컬럼만 개별적으로 높임:
#     ALTER TABLE orders ALTER COLUMN status SET STATISTICS 500;
#
# reload로 변경 가능
default_statistics_target = 100

# ─── 병렬 쿼리 ───

# max_parallel_workers_per_gather (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 하나의 Gather/Gather Merge 노드가 사용할 수 있는 최대 워커 프로세스 수.
#
# 2이면: SELECT 실행 시 리더 프로세스 1 + 워커 2 = 최대 3개가 병렬 처리.
#
# 병렬이 발동하는 조건:
#   - 테이블이 충분히 클 것 (min_parallel_table_scan_size, 기본 8MB)
#   - 비용이 충분히 높을 것 (parallel_tuple_cost, parallel_setup_cost)
#   - 트랜잭션이 read-only이거나 함수가 PARALLEL SAFE일 것
#
# 확인:
#   EXPLAIN에서 "Workers Planned: 2" 같은 출력이 보이면 병렬 쿼리 사용 중.
#
# reload로 변경 가능
max_parallel_workers_per_gather = 2

# max_parallel_workers (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 시스템 전체에서 동시에 활성화될 수 있는 병렬 워커의 최대 수.
#
# max_parallel_workers_per_gather = 2이고 동시에 3개 쿼리가 병렬 실행하면
# 최대 6개 워커가 필요한데, max_parallel_workers = 4이면
# 4개만 할당되고 나머지 쿼리는 워커 수가 줄어든다.
#
# CPU 코어 수에 맞추는 것이 일반적.
#
# 변경 시 재시작 필요
max_parallel_workers = 4

# max_parallel_maintenance_workers (integer)
# ─────────────────────────────────────────────────────────────────────────────
# CREATE INDEX, VACUUM 등 유지보수 작업의 병렬 워커 수.
#
# 2이면: CREATE INDEX CONCURRENTLY 시 2개 워커가 인덱스 빌드를 병렬 처리.
#
# 효과가 큰 경우:
#   - 수천만 행 테이블에 인덱스 생성 시 → 시간이 절반 이하로 줄어들 수 있음
#   - 대용량 VACUUM 시
#
# reload로 변경 가능
max_parallel_maintenance_workers = 2

# jit (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# JIT(Just-In-Time) 컴파일 활성화 여부.
#
# JIT이 하는 일:
#   WHERE 조건 평가, 집계 함수, 튜플 디코딩 등을 실행 시점에
#   LLVM으로 기계어 코드로 컴파일하여 실행. 인터프리터 방식보다 빠름.
#
# 효과가 큰 경우:
#   - 수백만~수억 행을 스캔하는 분석(OLAP) 쿼리
#   - CPU-bound 작업 (복잡한 WHERE, 많은 컬럼의 집계)
#
# 효과가 없거나 역효과인 경우:
#   - 짧은 OLTP 쿼리 (컴파일 오버헤드 > 실행 시간)
#   - 이미 인덱스로 소량만 읽는 경우
#
# EXPLAIN에서 "JIT: true"가 보이면 JIT이 사용된 것.
# jit_above_cost(기본 100000)보다 비용이 높은 쿼리에만 적용된다.
#
# reload로 변경 가능
jit = on

# =============================================================================
# VACUUM / Autovacuum
# =============================================================================

# autovacuum (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# 자동 VACUUM/ANALYZE 실행 여부.
#
# 절대 끄지 마라! 끄면:
#   - dead tuple이 쌓여 테이블이 계속 비대해짐 (table bloat)
#   - 통계가 갱신되지 않아 플래너가 잘못된 실행 계획을 세움
#   - 최악의 경우 Transaction ID Wraparound → 데이터베이스가 정지됨
#
# 유일하게 끌 수 있는 상황:
#   대량 데이터 로드(bulk insert) 시 일시적으로 끄고, 끝나면 수동 VACUUM.
autovacuum = on

# autovacuum_max_workers (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 동시에 실행할 수 있는 autovacuum 워커 프로세스의 최대 수.
#
# 3이면: 동시에 최대 3개 테이블을 병렬로 VACUUM/ANALYZE.
#
# 테이블이 수백 개 이상이면 5로 늘리는 것을 고려.
# 각 워커는 maintenance_work_mem(64MB)까지 사용할 수 있다.
# 3 × 64MB = 192MB.
#
# 변경 시 재시작 필요
autovacuum_max_workers = 3

# autovacuum_vacuum_threshold (integer)
# ─────────────────────────────────────────────────────────────────────────────
# VACUUM이 트리거되기 위한 최소 dead tuple 수.
#
# autovacuum_vacuum_scale_factor와 함께 동작한다:
#   VACUUM 조건 = dead tuples > threshold + scale_factor × 테이블 행 수
#                = 50 + 0.2 × N
#
# 예시:
#   - 100행 테이블: 50 + 0.2×100 = 70개 dead tuple이면 VACUUM
#   - 100만행 테이블: 50 + 0.2×1,000,000 = 200,050개 dead tuple이면 VACUUM
#
# 대용량 테이블에서 20% dead tuple이 쌓일 때까지 기다리는 게 너무 길다면
# 테이블별로 scale_factor를 낮춘다:
#   ALTER TABLE orders SET (autovacuum_vacuum_scale_factor = 0.05);
autovacuum_vacuum_threshold = 50

# autovacuum_vacuum_scale_factor (float: 0.0 ~ 1.0)
# ─────────────────────────────────────────────────────────────────────────────
# 위의 threshold와 함께 VACUUM 트리거 조건을 결정하는 비율.
# 0.2 = 테이블 전체 행의 20%가 dead tuple이면 VACUUM.
#
# reload로 변경 가능
autovacuum_vacuum_scale_factor = 0.2

# autovacuum_analyze_threshold (integer)
# ─────────────────────────────────────────────────────────────────────────────
# ANALYZE가 트리거되기 위한 최소 변경 행 수.
# autovacuum_analyze_scale_factor와 함께:
#   ANALYZE 조건 = 변경 행 > 50 + 0.1 × 테이블 행 수
#
# VACUUM보다 더 자주 실행되도록 scale_factor가 0.1(10%)로 낮게 설정됨.
# 통계가 오래되면 플래너가 나쁜 계획을 세우므로 자주 갱신하는 게 좋다.
autovacuum_analyze_threshold = 50

# autovacuum_analyze_scale_factor (float)
# ─────────────────────────────────────────────────────────────────────────────
# 0.1 = 테이블 전체 행의 10%가 변경(INSERT/UPDATE/DELETE)되면 ANALYZE 실행.
#
# reload로 변경 가능
autovacuum_analyze_scale_factor = 0.1

# =============================================================================
# 로깅
# =============================================================================

# logging_collector (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# 별도의 로그 수집 프로세스를 사용할지 여부.
#
# on이면:
#   PostgreSQL이 logger 프로세스를 띄워 stderr 출력을 로그 파일로 리다이렉트.
#   log_directory, log_filename으로 파일 위치와 이름 형식 지정.
#
# off이면:
#   stderr로 직접 출력. Docker에서는 docker logs로 볼 수 있지만
#   파일로 남지 않아 이후 분석이 어렵다.
#
# 변경 시 재시작 필요
logging_collector = on

# log_directory (string)
# ─────────────────────────────────────────────────────────────────────────────
# 로그 파일이 저장되는 디렉토리. PGDATA 기준 상대경로.
# 'log' → /var/lib/postgresql/data/log/
#
# docker-compose.yml에서 pglog 볼륨으로 마운트되어 있어
# 컨테이너가 삭제되어도 로그가 보존된다.
#
# reload로 변경 가능
log_directory = 'log'

# log_filename (string)
# ─────────────────────────────────────────────────────────────────────────────
# 로그 파일명 패턴. strftime 형식.
# 'postgresql-%Y-%m-%d.log' → postgresql-2025-01-31.log (일별 파일)
#
# reload로 변경 가능
log_filename = 'postgresql-%Y-%m-%d.log'

# log_statement (enum: none | ddl | mod | all)
# ─────────────────────────────────────────────────────────────────────────────
# 어떤 SQL 문을 로그에 기록할지.
#
# - none: 기록 안 함
# - ddl : CREATE, ALTER, DROP 등 스키마 변경만
# - mod : ddl + INSERT, UPDATE, DELETE 등 데이터 변경
# - all : 모든 SQL (SELECT 포함)
#
# 'all'은 학습/디버깅에 유용하지만 프로덕션에서는 로그 양이 폭발한다.
# 프로덕션 권장: 'ddl' 또는 'none' + log_min_duration_statement로 슬로우 쿼리만.
#
# reload로 변경 가능
log_statement = 'all'

# log_duration (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# 각 SQL 문의 실행 시간을 로그에 기록.
# log_statement = 'all'과 함께 쓰면 모든 쿼리의 소요 시간을 볼 수 있다.
#
# 프로덕션에서는 log_min_duration_statement만 쓰는 게 낫다 (아래 참조).
#
# reload로 변경 가능
log_duration = on

# log_min_duration_statement (integer, ms)
# ─────────────────────────────────────────────────────────────────────────────
# 이 시간(ms) 이상 걸린 SQL만 로그에 기록.
#
# 100 = 100ms 이상 걸린 쿼리만 기록.
# 0 = 모든 쿼리 기록 (log_statement='all'과 유사하지만 실행 시간도 같이 기록).
# -1 = 비활성화.
#
# 프로덕션에서 슬로우 쿼리를 잡는 핵심 설정:
#   - 100~500ms로 설정해두면 성능 문제를 빠르게 파악 가능
#   - log_statement='none' + log_min_duration_statement=200 조합이 실전적
#
# reload로 변경 가능
log_min_duration_statement = 100

# log_lock_waits (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# deadlock_timeout(기본 1초) 이상 락을 대기한 경우 로그에 기록.
#
# 왜 유용한가:
#   락 대기가 자주 발생하면 동시성 문제가 있다는 신호.
#   이 로그를 보고 어떤 쿼리가 락을 오래 잡고 있는지 파악할 수 있다.
#
# reload로 변경 가능
log_lock_waits = on

# log_temp_files (integer, kB)
# ─────────────────────────────────────────────────────────────────────────────
# 이 크기(kB) 이상의 임시 파일이 생성/삭제될 때 로그에 기록.
#
# 0 = 모든 임시 파일을 기록.
# -1 = 기록 안 함.
#
# 임시 파일이 자주 생기면 work_mem이 부족하다는 뜻.
# 이 로그를 모니터링해서 work_mem 튜닝의 근거로 사용한다.
#
# reload로 변경 가능
log_temp_files = 0

# =============================================================================
# 통계 수집
# =============================================================================

# track_activities (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# 각 백엔드가 현재 실행 중인 쿼리 정보를 수집.
# pg_stat_activity 뷰의 query, state 등의 데이터 소스.
#
# 끄면 pg_stat_activity에서 현재 쿼리를 볼 수 없다.
# 오버헤드가 매우 작으므로 항상 on 유지.
#
# reload로 변경 가능
track_activities = on

# track_counts (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# 테이블/인덱스의 접근 통계(행 읽기, 삽입, 삭제 수 등)를 수집.
# pg_stat_user_tables, pg_stat_user_indexes 등의 데이터 소스.
#
# autovacuum이 이 통계를 보고 VACUUM/ANALYZE 시점을 결정한다.
# 끄면 autovacuum이 제대로 작동하지 않는다!
#
# reload로 변경 가능
track_counts = on

# track_io_timing (boolean)
# ─────────────────────────────────────────────────────────────────────────────
# 각 I/O 연산(블록 읽기/쓰기)의 소요 시간을 측정.
#
# on이면:
#   EXPLAIN (ANALYZE, BUFFERS)에서 I/O Time 정보가 나온다:
#   "Buffers: shared hit=100 read=50, I/O Timings: read=12.345"
#
#   pg_stat_database의 blk_read_time, blk_write_time도 채워진다.
#
# 오버헤드:
#   매 I/O마다 gettimeofday() 호출. 대부분의 현대 OS에서 오버헤드 무시할 수준.
#   일부 오래된 커널에서만 문제 가능.
#
# 쿼리 성능 분석의 핵심 데이터이므로 항상 on 권장.
#
# reload로 변경 가능
track_io_timing = on

# track_wal_io_timing (boolean) — PostgreSQL 17
# ─────────────────────────────────────────────────────────────────────────────
# WAL 관련 I/O(WAL 쓰기, fsync)의 소요 시간을 측정.
# pg_stat_wal의 wal_write_time, wal_sync_time을 채운다.
#
# WAL이 병목인지 판단할 때 유용:
#   wal_sync_time이 높으면 → 디스크 fsync가 느리다 → 더 빠른 디스크 필요
#   또는 wal_buffers를 늘려 write 빈도를 줄일 수 있다.
#
# PostgreSQL 17에서 추가된 설정.
#
# reload로 변경 가능
track_wal_io_timing = on

# ─── pg_stat_statements (확장 모듈) ───

# shared_preload_libraries (string)
# ─────────────────────────────────────────────────────────────────────────────
# 서버 시작 시 미리 로드할 공유 라이브러리.
#
# pg_stat_statements:
#   실행된 모든 SQL의 통계(호출 수, 총 시간, 평균 시간, 행 수 등)를 수집.
#   슬로우 쿼리 분석의 가장 중요한 도구.
#
#   SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;
#   → 가장 시간을 많이 쓴 쿼리 TOP 10
#
# 여러 라이브러리를 쉼표로 구분:
#   shared_preload_libraries = 'pg_stat_statements, auto_explain'
#
# 변경 시 재시작 필요
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements.max (integer)
# ─────────────────────────────────────────────────────────────────────────────
# 추적할 고유 SQL 문의 최대 수.
#
# 5000이면: 쿼리 패턴(파라미터 무시) 5000개까지 저장.
# 초과하면 가장 덜 사용된 항목이 제거된다.
#
# 쿼리 종류가 매우 다양한 앱(ORM이 동적 쿼리 생성)이면 10000으로 늘린다.
# 각 항목이 약 몇 KB를 차지하므로 5000 × ~2KB ≈ 10MB 정도의 공유 메모리 사용.
#
# 변경 시 재시작 필요
pg_stat_statements.max = 5000

# pg_stat_statements.track (enum: none | top | all)
# ─────────────────────────────────────────────────────────────────────────────
# 어떤 SQL을 추적할지.
#
# - top : 클라이언트가 직접 실행한 SQL만 (기본값)
# - all : 함수/프로시저 내부에서 실행된 SQL도 포함
# - none: 추적 안 함
#
# 'all'로 설정하면 PL/pgSQL 함수 안의 개별 쿼리도 추적 가능.
# 학습 환경이므로 all.
#
# reload로 변경 가능
pg_stat_statements.track = all

# =============================================================================
# v17 신규 설정
# =============================================================================

# io_combine_limit (integer) — PostgreSQL 17
# ─────────────────────────────────────────────────────────────────────────────
# 여러 개의 작은 I/O 요청을 하나의 큰 요청으로 결합할 때의 최대 크기.
#
# 128kB이면: 인접한 8KB 페이지 최대 16개를 하나의 128KB I/O로 합쳐 요청.
# Sequential Scan 시 디스크에 보내는 I/O 요청 수가 줄어 성능이 향상된다.
#
# SSD/NVMe에서는 기본값이 적절. HDD에서 큰 순차 읽기가 많으면 늘릴 수 있다.
# io_combine_limit = 128kB

# transaction_timeout (integer, ms) — PostgreSQL 17
# ─────────────────────────────────────────────────────────────────────────────
# 하나의 트랜잭션이 실행될 수 있는 최대 시간.
# 0 = 무제한.
#
# statement_timeout과의 차이:
#   - statement_timeout: 개별 SQL 문의 최대 실행 시간
#   - transaction_timeout: BEGIN ~ COMMIT/ROLLBACK 전체의 최대 시간
#
# idle_in_transaction_session_timeout과의 차이:
#   - idle_in_transaction: 트랜잭션 안에서 아무것도 안 하고 놀고 있는 시간
#   - transaction_timeout: 활발히 쿼리를 실행 중이어도 전체 시간이 초과되면 종료
#
# 사용 사례:
#   배치 작업이 실수로 무한 루프에 빠져 트랜잭션이 끝나지 않는 상황 방지.
#   예: transaction_timeout = '30min'
# transaction_timeout = 0
